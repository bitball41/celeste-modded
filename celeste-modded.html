<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Celeste Modded</title>
</head>
<body>
  <main id="menu">
    <h1>Celeste Modded</h1>
    <p>Choose how progress should be saved.</p>

    <h2>Separate saves</h2>
    <button data-bundle="tornado-valley" data-save="tornado-valley">Tornado Valley</button>
    <button data-bundle="path-of-hope" data-save="path-of-hope">Path of Hope (A-side)</button>
    <button data-bundle="cat-isle" data-save="cat-isle">Cat Isle</button>

    <h2>One shared save</h2>
    <button data-bundle="tornado-valley,path-of-hope,cat-isle" data-save="shared">All three maps</button>
  </main>

  <main id="loading" hidden>
    <h1>Loading Celeste</h1>
    <p id="status">Resolving the current build…</p>
    <p id="error"></p>
  </main>

  <script>
    (function () {
      "use strict";

      var REPOSITORY = "Bitball41/celeste-modded";
      var RUNTIME_BRANCH = "runtime";
      var menu = document.getElementById("menu");
      var loading = document.getElementById("loading");
      var status = document.getElementById("status");
      var error = document.getElementById("error");
      var booting = false;

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Failed to load " + src)); };
          document.head.appendChild(script);
        });
      }

      async function resolveRuntime() {
        var response = await fetch(
          "https://api.github.com/repos/" + REPOSITORY + "/commits/" + RUNTIME_BRANCH + "?loader=" + Date.now(),
          { cache: "no-store", headers: { Accept: "application/vnd.github+json" } }
        );
        if (!response.ok) throw new Error("Could not find the runtime build (HTTP " + response.status + ").");
        var sha = String((await response.json()).sha || "");
        if (!/^[0-9a-f]{40}$/i.test(sha)) throw new Error("The runtime returned an invalid commit.");
        return sha;
      }

      async function start(bundle, save) {
        if (booting) return;
        booting = true;
        menu.hidden = true;
        loading.hidden = false;

        if (!globalThis.crossOriginIsolated) {
          status.textContent = "Cannot start here.";
          error.textContent = "This loader needs COOP and COEP headers because Webleste uses WASM threads.";
          return;
        }

        try {
          var sha = await resolveRuntime();
          var base = "https://cdn.jsdelivr.net/gh/" + REPOSITORY + "@" + sha + "/";
          var response = await fetch(base + ".vite/manifest.json");
          if (!response.ok) throw new Error("Could not load the runtime manifest (HTTP " + response.status + ").");
          var entry = (await response.json())["index.html"];
          if (!entry || !entry.file) throw new Error("The Webleste entry is missing from the runtime manifest.");

          var baseTag = document.createElement("base");
          baseTag.href = base;
          document.head.appendChild(baseTag);
          (entry.css || []).forEach(function (file) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = base + file;
            document.head.appendChild(link);
          });

          var params = new URLSearchParams();
          if (bundle) params.set("bundle", bundle);
          params.set("save", save);
          history.replaceState(null, "", location.pathname + "?" + params.toString());
          document.body.innerHTML = '<div id="app"></div>';
          await loadScript(base + "bundled-mods.js");
          await import(base + entry.file);
        } catch (reason) {
          console.error("[Celeste loader]", reason);
          status.textContent = "Could not load Celeste.";
          error.textContent = reason instanceof Error ? reason.message : String(reason);
          booting = false;
        }
      }

      document.querySelectorAll("button[data-save]").forEach(function (button) {
        button.addEventListener("click", function () {
          start(button.getAttribute("data-bundle"), button.getAttribute("data-save"));
        });
      });
    })();
  </script>
</body>
</html>
