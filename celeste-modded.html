<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Celeste Modded</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; color: #eee; background: #111; font: 15px/1.45 system-ui, sans-serif; }
    main { width: min(460px, 100%); }
    h1 { margin: 0 0 6px; font-size: 24px; }
    h2 { margin: 24px 0 8px; font-size: 14px; }
    p { margin: 0 0 14px; color: #aaa; }
    .buttons { display: grid; gap: 8px; }
    button { width: 100%; padding: 12px 14px; border: 1px solid #3a3a3a; border-radius: 6px; color: #eee; background: #1c1c1c; font: inherit; text-align: left; cursor: pointer; }
    button:hover { background: #252525; border-color: #555; }
    button span { display: block; margin-top: 2px; color: #999; font-size: 12px; }
    #loading { display: none; text-align: center; }
    #loading.visible { display: block; }
    #error { color: #e99; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main id="menu">
    <h1>Celeste Modded</h1>
    <p>Choose how progress should be saved.</p>

    <h2>Separate saves</h2>
    <div class="buttons">
      <button data-bundle="tornado-valley" data-save="tornado-valley">Tornado Valley<span>Uses its own save.</span></button>
      <button data-bundle="path-of-hope" data-save="path-of-hope">Path of Hope<span>Uses its own save. Start with the A-side.</span></button>
      <button data-bundle="cat-isle" data-save="cat-isle">Cat Isle<span>Uses its own save.</span></button>
    </div>

    <h2>One shared save</h2>
    <div class="buttons">
      <button data-bundle="tornado-valley,path-of-hope,cat-isle" data-save="shared">All three maps<span>Progress for every bundled map stays in one save.</span></button>
    </div>
  </main>

  <main id="loading">
    <h1>Loading Celeste</h1>
    <p id="status">Resolving the current build…</p>
    <p id="error"></p>
  </main>

  <script>
    (function () {
      "use strict";

      var REPOSITORY = "Bitball41/celeste-modded";
      var RUNTIME_BRANCH = "runtime";
      var menu = document.getElementById("menu");
      var loading = document.getElementById("loading");
      var status = document.getElementById("status");
      var error = document.getElementById("error");
      var booting = false;

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = function () { reject(new Error("Failed to load " + src)); };
          document.head.appendChild(script);
        });
      }

      async function resolveRuntime() {
        var response = await fetch(
          "https://api.github.com/repos/" + REPOSITORY + "/commits/" + RUNTIME_BRANCH + "?loader=" + Date.now(),
          { cache: "no-store", headers: { Accept: "application/vnd.github+json" } }
        );
        if (!response.ok) throw new Error("Could not find the runtime build (HTTP " + response.status + ").");
        var sha = String((await response.json()).sha || "");
        if (!/^[0-9a-f]{40}$/i.test(sha)) throw new Error("The runtime returned an invalid commit.");
        return sha;
      }

      async function start(bundle, save) {
        if (booting) return;
        booting = true;
        menu.hidden = true;
        loading.classList.add("visible");

        if (!globalThis.crossOriginIsolated) {
          status.textContent = "Cannot start here.";
          error.textContent = "This loader needs COOP and COEP headers because Webleste uses WASM threads.";
          return;
        }

        try {
          var sha = await resolveRuntime();
          var base = "https://cdn.jsdelivr.net/gh/" + REPOSITORY + "@" + sha + "/";
          var response = await fetch(base + ".vite/manifest.json");
          if (!response.ok) throw new Error("Could not load the runtime manifest (HTTP " + response.status + ").");
          var entry = (await response.json())["index.html"];
          if (!entry || !entry.file) throw new Error("The Webleste entry is missing from the runtime manifest.");

          var baseTag = document.createElement("base");
          baseTag.href = base;
          document.head.appendChild(baseTag);
          (entry.css || []).forEach(function (file) {
            var link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = base + file;
            document.head.appendChild(link);
          });

          var params = new URLSearchParams();
          if (bundle) params.set("bundle", bundle);
          params.set("save", save);
          history.replaceState(null, "", location.pathname + "?" + params.toString());
          document.body.innerHTML = '<div id="app"></div>';
          await loadScript(base + "bundled-mods.js");
          await import(base + entry.file);
        } catch (reason) {
          console.error("[Celeste loader]", reason);
          status.textContent = "Could not load Celeste.";
          error.textContent = reason instanceof Error ? reason.message : String(reason);
          booting = false;
        }
      }

      document.querySelectorAll("button[data-save]").forEach(function (button) {
        button.addEventListener("click", function () {
          start(button.getAttribute("data-bundle"), button.getAttribute("data-save"));
        });
      });
    })();
  </script>
</body>
</html>
